receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s 
    send_batch_size: 512 

  memory_limiter:
    check_interval: 10s
    limit_mib: 256
    spike_limit_mib: 64  


  filter/metrics:
    metrics:
      exclude: 
        match_type: regexp
        metric_names:
          - "^kestrel.*"
          - "^dns.*"

  transform/traces:
    error_mode: ignore
    trace_statements:
      - context: span
        statements: 
          - 'set(status.code, STATUS_CODE_OK) where status.code == STATUS_CODE_UNSET'
        
exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:9464" #deply metrics from collector to specific path and make prometheus scrape Metric from this target

  debug:
    verbosity: detailed
    


service:
  pipelines:
  
    traces:
      receivers: [otlp]
      processors: [memory_limiter ,transform/traces, batch]
      exporters: [debug, otlp/jaeger]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter ,batch ,filter/metrics ]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter ,batch]
      exporters: [debug]
