
services:

  wafra-db:
    image: postgres
    container_name: wafra-postgresql-database

    environment:
      POSTGRES_DB: wafra-database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
    - wafra-postgres-data:/var/lib/postgresql
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wafra-database"]
      interval: 5s
      timeout: 5s
      retries: 5


  wafra-app:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "8083:8080"

    environment:
      ConnectionStrings__Default: "Host=wafra-db;Port=5432;Database=wafra-database;Username=postgres;Password=postgres"
    
      JWT__Key: ${JWT_KEY}
      JWT__Issuer: ${JWT_ISSUER}
      JWT__Audience: ${JWT_AUDIENCE}

    depends_on:
        wafra-db:
          condition: service_healthy

        
  
  otel-collector-app:
    image: otel/opentelemetry-collector-contrib
    container_name: otel-collector-wafra-app

    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml

    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

  jaeger:
    depends_on:
      - otel-collector-app
    container_name: wafra-jaeger-trace
    image: jaegertracing/all-in-one
    ports:
      - 6831:6831/udp # jaeger agent - thrifty comapct
      - 6832:6832/udp # jaeger agent - thrifty binary
      - 5778:5778 # configs
      - 16686:16686 # jaeger UI
      - 14268:14268  # collector (otlp http / thrifty )
      - 14250:14250 # grpc


  prometheus:
    image: prom/prometheus
    container_name: wafra-prometheus-metrics
    ports:
      - 9092:9090

    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    depends_on:
      - otel-collector-app
    



volumes:
  wafra-postgres-data: