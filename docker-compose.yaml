services:
  wafra-app:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "8083:8080"

    environment:
      JWT__Key: ${JWT_KEY}
      JWT__Issuer: ${JWT_ISSUER}
      JWT__Audience: ${JWT_AUDIENCE}
    depends_on:
      - otel-collector-app
  
  otel-collector-app:
    image: otel/opentelemetry-collector-contrib
    container_name: otel-collector-wafra-app

    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml

    ports:
      - "4317:4317"
      - "4318:4318"

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

  jaeger:
    depends_on:
      - otel-collector-app
    container_name: wafra-jaeger-trace
    image: jaegertracing/all-in-one
    ports:
      - 6831:6831/udp # jaeger agent - thrifty comapct
      - 6832:6832/udp # jaeger agent - thrifty binary
      - 5778:5778 # configs
      - 16686:16686 # jaeger UI
      - 14268:14268  # collector (otlp http / thrifty )
      - 14250:14250 # grpc