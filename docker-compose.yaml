
services:

  wafra-db:
    image: postgres
    container_name: wafra-postgresql-database

    environment:
      POSTGRES_DB: wafra-database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
    - wafra-postgres-data:/var/lib/postgresql
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wafra-database"]
      interval: 5s
      timeout: 5s
      retries: 5


  wafra-app:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "8083:8080"

    environment:
      ConnectionStrings__Default: "Host=wafra-db;Port=5432;Database=wafra-database;Username=postgres;Password=postgres"
    
      JWT__Key: ${JWT_KEY}
      JWT__Issuer: ${JWT_ISSUER}
      JWT__Audience: ${JWT_AUDIENCE}

    depends_on:
        wafra-db:
          condition: service_healthy

        
  
  otel-collector-app:
    image: otel/opentelemetry-collector-contrib
    container_name: otel-collector-wafra-app

    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml

    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464" #for export metrics
      - "13133:13133" #health check endpoint
      - "55679:55679" # for zPages

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

  jaeger:
    depends_on:
      - otel-collector-app
    container_name: wafra-jaeger-trace
    image: jaegertracing/all-in-one
    environment:
      SPAN_STORAGE_TYPE: badger      # we define badger as backend storge for our spans ansd traces
      BADGER_EPHEMERAL: "false"       # here we make our badger use Permanent storage Instead of temporary storage
      BADGER_DIRECTORY_KEY: /badger/data/keys  # path of indexs keys and values
      BADGER_DIRECTORY_VALUE: /badger/data/values  

    volumes:
      - ./jaeger-data:/badger    # after i create folder jaeger-date, here will store data in local folder not just in container, data will not delete if container recreted

    ports:
      - 6831:6831/udp # jaeger agent - thrifty comapct
      - 6832:6832/udp # jaeger agent - thrifty binary
      - 5778:5778 # configs
      - 16686:16686 # jaeger UI
      - 14268:14268  # collector (otlp http / thrifty )
      - 14250:14250 # grpc


  prometheus:
    image: prom/prometheus
    container_name: wafra-prometheus-metrics
    ports:
      - 9092:9090

    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    depends_on:
      - otel-collector-app
    

  loki:
    image: grafana/loki:3.7.0
    container_name: wafra-loki-logs
    command: -config.file=/etc/loki/config.yaml

    ports:
      - "127.0.0.1:3100:3100"

    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    container_name: wafra-grafana

    ports: 
      - "127.0.0.1:3000:3000"
    volumes:  
       - grafana-data:/var/lib/grafana
       - ./datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro

    depends_on:
      - loki
    restart: unless-stopped


volumes:
  wafra-postgres-data:
  jaeger_badger_data:
  loki-data:
  grafana-data: